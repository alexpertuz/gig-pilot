# sources.yml — gig-ops source configuration
#
# Copy this file to sources.yml in the project root and customize it.
# This is a User Layer file — it will never be auto-updated.
#
# Run: cp templates/sources.example.yml sources.yml

# ─── Filters ──────────────────────────────────────────────────────────────────
# All filters are AND'd. Empty arrays = no filtering on that dimension.
# Title filter: gig title must contain at least one of these strings (case-insensitive).
title_filter:
  - "looking for"
  - "need a developer"
  - "need a designer"
  - "need a"
  - "seeking"
  - "[Hiring]"
  - "contract"
  - "freelance"

# Content filter: gig description must contain at least one of these strings.
# Helps exclude posts with no budget signal.
content_filter:
  - "budget"
  - "paid"
  - "rate"
  - "hourly"
  - "fixed price"
  - "compensation"
  - "$"
  - "€"
  - "£"

# Location filter: at least one must match (empty string = remote/unspecified accepted).
location_filter:
  - "remote"
  - ""

# Budget filter: minimum acceptable budget signals.
budget_filter:
  min_hourly: 20
  min_project: 150
  exclude_unpaid: true

# ─── Scan history ─────────────────────────────────────────────────────────────
scan_history:
  ttl_days: 30

# ─── Gig boards (provider-based) ─────────────────────────────────────────────
gig_boards:

  # Reddit - public JSON API, no auth required
  - name: "r/forhire"
    provider: reddit
    subreddit: forhire
    search_queries:
      - "[Hiring]"
      - "looking for a developer"
      - "looking for a designer"
      - "looking for a freelancer"

  - name: "r/jobbit"
    provider: reddit
    subreddit: jobbit
    search_queries:
      - "[Hiring]"

  - name: "r/hiring"
    provider: reddit
    subreddit: hiring
    search_queries:
      - "contract"
      - "freelance"
      - "part-time"

  # RemoteOK - remote-first gig board with clean public API
  - name: "RemoteOK"
    provider: remoteok
    tags:
      - dev
      - frontend
      - backend
      - fullstack

  # WorkingNomads
  - name: "WorkingNomads"
    provider: workingnomads
    categories:
      - programming

# ─── Tracked posters ──────────────────────────────────────────────────────────
# Track specific Reddit users or company accounts.
# These bypass title/content filters (you have already vetted the source).
