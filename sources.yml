# sources.yml — gig-ops source configuration (active)
# Tuned for DEMAND-SIDE freelance gigs (someone looking to hire), not full-time roles.

# ─── Filters ──────────────────────────────────────────────────────────────────
# title_filter and content_filter use { positive, negative } keyword lists.
#   positive: title/description must contain at least one of these (if list is non-empty)
#   negative: drop if it contains any of these
title_filter:
  positive:
    - "[hiring]"
    - "looking for"
    - "need a"
    - "needed"
    - "seeking"
    - "wanted"
    - "freelance"
    - "freelancer"
    - "contract"
    - "for hire"        # r/forhire demand+supply; negative list trims the supply side
  negative:
    - "[for hire]"      # exclude freelancers advertising themselves (supply side)
    - "intern"
    - "internship"
    - "unpaid"
    - "volunteer"

content_filter:
  positive: []          # empty = don't require body keywords (titles already filtered)
  negative:
    - "equity only"
    - "revenue share only"
    - "for exposure"
    - "for your portfolio"

# location_filter: { always_allow, allow, block }
location_filter:
  always_allow:
    - "remote"
  block: []

# ─── Budget filter (freelance — hourly/project, NOT annual salary) ────────────
budget_filter:
  min_hourly: 15
  min_project: 100
  exclude_unpaid: true

# ─── Scan history ─────────────────────────────────────────────────────────────
scan_history:
  ttl_days: 30

# ─── Gig boards ───────────────────────────────────────────────────────────────
gig_boards:

  # Reddit — the primary demand-side source. Public RSS, no auth.
  # NOTE: space scans a few minutes apart — Reddit rate-limits unauthenticated
  # requests (~1 req / 2-3s). Hammering it returns 429 / zero results.
  - name: "r/forhire"
    provider: reddit
    subreddit: forhire
    # search_queries narrow the RSS feed locally by title. [Hiring] = demand side.
    search_queries:
      - "[hiring]"

  - name: "r/jobbit"
    provider: reddit
    subreddit: jobbit

  - name: "r/slavelabour"
    provider: reddit
    subreddit: slavelabour
    search_queries:
      - "[task]"
      - "[hiring]"

  # Remote job boards — mostly FULL-TIME roles. Disabled by default because they
  # flood the inbox with non-freelance jobs. Enable + rely on title_filter if you
  # also want remote contract roles.
  - name: "RemoteOK"
    provider: remoteok
    enabled: false
    tags:
      - dev
      - contract

  - name: "WorkingNomads"
    provider: workingnomads
    enabled: false
    categories:
      - programming
