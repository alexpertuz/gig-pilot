# gig-ops — Canonical Lead Statuses
# Source of truth for tracker.mjs (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in leads.md must contain EXACTLY
# one of these values (case-insensitive). No markdown bold (**),
# no dates, no extra text. Dates go in the date column.

states:
  - id: new
    label: new
    aliases: [evaluated, scored]
    description: Gig evaluated, not yet contacted
    dashboard_group: new

  - id: contacted
    label: contacted
    aliases: [sent, applied, reached_out]
    description: Proposal/DM sent
    dashboard_group: contacted

  - id: replied
    label: replied
    aliases: [responded, response]
    description: Poster replied to outreach
    dashboard_group: replied

  - id: negotiating
    label: negotiating
    aliases: [negotiation, discussing, talking]
    description: Actively discussing terms/scope
    dashboard_group: negotiating

  - id: won
    label: won
    aliases: [closed, hired, started, active]
    description: Contract signed or work started
    dashboard_group: won

  - id: lost
    label: lost
    aliases: [ghost, ghosted, no_response]
    description: Poster went silent after 2+ follow-ups or explicitly declined
    dashboard_group: lost

  - id: dropped
    label: dropped
    aliases: [declined, pass, skip, discarded]
    description: You declined (low score, red flags, budget issues, etc.)
    dashboard_group: dropped
