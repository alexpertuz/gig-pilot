# gig-pilot Profile Configuration
# Copy this file to config/profile.yml and fill in your details.
# This is the single source of truth for your personal data across all modes.
#
# Run: cp config/profile.example.yml config/profile.yml

freelancer:
  full_name: "Jane Smith"
  email: "jane@example.com"
  location: "Remote"
  portfolio_url: "https://janesmith.dev"
  github: "github.com/janesmith"
  reddit: "u/janesmith"
  timezone: "UTC-5"

# ─── Services ─────────────────────────────────────────────────────────────────
# What you offer. Used by /gig (fit scoring) and /proposal (tailoring).
services:
  # Your primary offerings
  primary:
    - "Full-stack web development (React, Node.js)"
    - "API design and integration"
  # Secondary / stretch
  secondary:
    - "Technical consulting"
    - "Code review"

# Archetypes: map your services to concrete roles the scoring system understands.
# fit: primary = core offering, secondary = can do well, adjacent = stretch
archetypes:
  - name: "Full-stack Developer"
    stack: ["React", "Node.js", "TypeScript", "PostgreSQL"]
    fit: "primary"
  - name: "API / Backend Developer"
    stack: ["Node.js", "REST", "GraphQL"]
    fit: "primary"
  - name: "Frontend Developer"
    stack: ["React", "Next.js", "Tailwind"]
    fit: "secondary"
  - name: "Technical Consultant"
    fit: "adjacent"

# ─── Narrative ────────────────────────────────────────────────────────────────
narrative:
  headline: "Full-stack developer who ships fast and communicates clearly"
  # What makes you different from the 50 other people who'll respond
  differentiator: "I've built and shipped 3 products solo. I work async, I don't need hand-holding."
  superpowers:
    - "Turning vague requirements into working software quickly"
    - "Clear, concise async communication"
    - "Full product ownership — design → build → deploy"
  # Proof points for /proposal — concrete work samples with impact
  proof_points:
    - name: "SaaS dashboard rebuild"
      url: "https://janesmith.dev/work/saas-rebuild"
      hero_metric: "Cut load time 60%, increased trial-to-paid 18%"
    - name: "REST API for fintech startup"
      url: "https://janesmith.dev/work/fintech-api"
      hero_metric: "Handled 10K req/min on launch day, zero downtime"
    - name: "Open source CLI tool"
      url: "https://github.com/janesmith/tool"
      hero_metric: "800+ GitHub stars"

# ─── Rate card ────────────────────────────────────────────────────────────────
rate_card:
  # Target and walk-away rates. Used by budget scoring and negotiation scripts.
  hourly:
    target: 80      # $/hr you aim for
    walk_away: 40   # $/hr below which you decline
  project:
    min: 300        # minimum fixed-price project budget you'll consider
  # Payment models you accept
  accepted_models:
    - "hourly"
    - "fixed"
  # Models you decline by default (override per-gig with /gig --override)
  declined_models:
    - "unpaid"
    - "equity"
    - "revenue_share"

# ─── Ideal gig profile ────────────────────────────────────────────────────────
ideal_gig:
  # Scope: what kind of engagement you enjoy
  preferred_scope:
    - "well-defined feature or module"
    - "API integration"
    - "performance fix"
    - "greenfield small app"
  avoid_scope:
    - "vague 'build me a startup'"
    - "on-call / maintenance retainer with no clear end"
  # Duration sweet spot
  duration:
    min_days: 1
    max_days: 60
  # Keywords that make a gig more attractive (boost scoring)
  green_flags:
    - "spec ready"
    - "design done"
    - "well-documented"
    - "async-friendly"
    - "good communication"
  # Keywords that trigger extra scrutiny (not auto-decline, but flag for review)
  yellow_flags:
    - "MVP"
    - "ASAP"
    - "simple"
    - "quick"
    - "just need"

# ─── Proposal settings ────────────────────────────────────────────────────────
proposal:
  # Default channel style
  default_channel: "dm"       # dm | email
  # Length target
  length: "short"             # short (3-5 sentences) | medium (1-2 paragraphs) | full
  # Include proof point links in proposals?
  include_proof_links: true
  max_proof_links: 2

# ─── Output ───────────────────────────────────────────────────────────────────
output:
  # Auto-generate PDF for gigs scoring >= this threshold (0 = never auto, 5 = always)
  auto_pdf_threshold: 4.0
  # Report numbering start
  report_start: 1

# ─── Locale ───────────────────────────────────────────────────────────────────
# Default is English. Set to "es" to activate Spanish modes (modes/es/).
locale: en
